name: warm wfcli build cache

on:
  push:
    branches:
      - master
    paths:
      - Formula/wfcli.rb
  workflow_dispatch:
    inputs:
      clean:
        description: Rebuild without restoring existing build caches
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: wfcli-build-cache
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
      options: --privileged
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate wfcli build cache
        run: |
          cache_root="$(brew --cache)/wfcli-build"
          {
            echo "WFCLI_BUILD_CACHE_ROOT=${cache_root}"
            echo "HOMEBREW_TEMP_ROOT=$(brew ruby -e 'puts HOMEBREW_TEMP')"
            echo "SCCACHE_DIR=${cache_root}/sccache"
            echo "SCCACHE_SERVER_UDS=${cache_root}/sccache.sock"
          } >> "$GITHUB_ENV"
          echo "wfcli cache root: ${cache_root}"
          ls -ld "$(brew --cache)" "${cache_root}" 2>/dev/null || true

      - name: Install cache compressor
        run: brew install zstd

      - name: Restore wfcli build cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.clean != true }}
        id: wfcli-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/cargo
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/rebar3
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/archives
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/downloads
          key: linux-wfcli-build-v3-master-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-wfcli-build-v3-master-

      - name: Restore sccache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.clean != true }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: linux-wfcli-sccache-v1-master-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-wfcli-sccache-v1-master-

      - name: Build wfcli from source
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew install --verbose --build-from-source --keep-tmp "${TAP_NAME}/wfcli"

      - name: Prune build caches
        run: |
          declare -A active_abis=()
          while IFS= read -r -d '' abi_info; do
            abi="$(sha256sum "${abi_info}" | cut -d ' ' -f 1)"
            active_abis["${abi}"]=1
          done < <(
            find "${HOMEBREW_TEMP_ROOT}" \
              -path '*/_build/vcpkg_installed/*/share/*/vcpkg_abi_info.txt' \
              -type f -print0
          )

          if test "${#active_abis[@]}" -eq 0; then
            echo "warning: no active vcpkg ABI records found; skipping archive prune"
          else
            removed=0
            shopt -s nullglob
            for archive in "${WFCLI_BUILD_CACHE_ROOT}"/vcpkg/archives/*/*.zip; do
              abi="$(basename "${archive}" .zip)"
              if test -z "${active_abis[$abi]+present}"; then
                rm -f "${archive}"
                removed=$((removed + 1))
              fi
            done
            find "${WFCLI_BUILD_CACHE_ROOT}/vcpkg/archives" -mindepth 1 -type d -empty -delete
            echo "vcpkg active ABIs: ${#active_abis[@]}; stale archives removed: ${removed}"
          fi

      - name: Inspect wfcli build cache
        id: cache_state
        run: |
          make_log="$(brew --cache)/Logs/wfcli/01.make.log"
          if test -f "${make_log}"; then
            grep -m 1 -E "Restored [0-9]+ package" "${make_log}" || true
            grep -m 1 -E "Starting submission" "${make_log}" || true
            grep -m 1 -E "Completed submission" "${make_log}" || true
          fi
          echo "wfcli cache contents:"
          ls -la "${WFCLI_BUILD_CACHE_ROOT}"
          du -sh "${WFCLI_BUILD_CACHE_ROOT}"/* || true
          archive_count="$(find "${WFCLI_BUILD_CACHE_ROOT}/vcpkg/archives" -type f | wc -l)"
          echo "vcpkg archives: ${archive_count}"
          if test "${archive_count}" -eq 0 && test -f "${make_log}"; then
            grep -E "Failed to store binary cache|failed with exit code|not found" "${make_log}" || true
          fi
          echo "archive_count=${archive_count}" >> "$GITHUB_OUTPUT"

      - name: Verify wfcli build cache
        env:
          ARCHIVE_COUNT: ${{ steps.cache_state.outputs.archive_count }}
        run: test "${ARCHIVE_COUNT}" -gt 0

      - name: Save wfcli build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/cargo
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/rebar3
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/archives
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/downloads
          key: linux-wfcli-build-v3-master-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save sccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: linux-wfcli-sccache-v1-master-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_BUILD_CACHE_KEY: linux-wfcli-build-v3-master-${{ github.run_id }}-${{ github.run_attempt }}
          CURRENT_SCCACHE_CACHE_KEY: linux-wfcli-sccache-v1-master-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mapfile -t cache_ids < <(
            gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 --json id,key \
              --jq '.[] | select(
                (((.key | startswith("linux-wfcli-build-v")) and (.key | contains("-master-"))) or
                 (.key | startswith("linux-wfcli-sccache-v1-master-")) or
                 (.key | startswith("linux-homebrew-downloads-v1-master-"))) and
                .key != env.CURRENT_BUILD_CACHE_KEY and
                .key != env.CURRENT_SCCACHE_CACHE_KEY
              ) | .id'
          )
          for cache_id in "${cache_ids[@]}"; do
            gh cache delete "$cache_id" --repo "$GITHUB_REPOSITORY"
          done
