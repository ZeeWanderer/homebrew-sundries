name: warm wfcli build cache

on:
  push:
    branches:
      - master
    paths:
      - Formula/wfcli.rb
  workflow_dispatch:

permissions: {}

concurrency:
  group: wfcli-build-cache
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
      options: --privileged
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate wfcli build cache
        run: |
          cache_root="$(brew --cache)/wfcli-build"
          echo "WFCLI_BUILD_CACHE_ROOT=${cache_root}" >> "$GITHUB_ENV"
          echo "wfcli cache root: ${cache_root}"
          ls -ld "$(brew --cache)" "${cache_root}" 2>/dev/null || true

      - name: Cache wfcli build data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/ccache
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/cargo
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/archives
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/downloads
          key: linux-wfcli-build-v1-master-${{ github.sha }}
          restore-keys: linux-wfcli-build-v1-master-

      - name: Build wfcli from source
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew install --build-from-source "${TAP_NAME}/wfcli"

      - name: Verify wfcli build cache
        run: |
          echo "wfcli cache contents:"
          ls -la "${WFCLI_BUILD_CACHE_ROOT}"
          find "${WFCLI_BUILD_CACHE_ROOT}" -maxdepth 3 -type d -print | sort
          du -sh "${WFCLI_BUILD_CACHE_ROOT}"/*
          archive_count="$(find "${WFCLI_BUILD_CACHE_ROOT}/vcpkg/archives" -type f | wc -l)"
          echo "vcpkg archives: ${archive_count}"
          test "${archive_count}" -gt 0
          ccache --show-stats
