name: brew test-bot

on:
  push:
    branches:
      - master
    paths:
      - Formula/**
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - Formula/**
      - .github/workflows/tests.yml

concurrency:
  group: wfcli-build-cache
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main # zizmor: ignore[unpinned-images]
      options: --privileged
    permissions:
      actions: read
      checks: read
      contents: read
      packages: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Locate wfcli build cache
        run: |
          {
            echo "WFCLI_BUILD_CACHE_ROOT=$(brew --cache)/wfcli-build"
            echo "SCCACHE_DIR=$(brew --cache)/wfcli-build/sccache"
          } >> "$GITHUB_ENV"

      - name: Install cache compressor
        if: github.event_name == 'pull_request'
        run: brew install zstd

      - name: Restore wfcli build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/cargo
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/rebar3
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/archives
            ${{ env.WFCLI_BUILD_CACHE_ROOT }}/vcpkg/downloads
          key: linux-wfcli-build-v3-pr-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-wfcli-build-v3-master-

      - name: Restore sccache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: linux-wfcli-sccache-v1-pr-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: linux-wfcli-sccache-v1-master-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        if: github.event_name == 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - run: brew test-bot --verbose --only-formulae --root-url=https://ghcr.io/v2/zeewanderer/sundries
        if: github.event_name == 'pull_request'
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_linux
          path: '*.bottle.*'
          compression-level: 0
          retention-days: 7
