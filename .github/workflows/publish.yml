name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
      allow_failed_checks:
        description: Publish after manually reviewing failed checks
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: brew-pr-pull
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      issues: read
      packages: write
      pull-requests: write
    steps:
      - name: Verify publication request
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FAILED_CHECKS: ${{ inputs.allow_failed_checks }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mapfile -t pr < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
            --jq '.state, .head.repo.full_name, .head.ref, .head.sha')
          [[ "${pr[0]}" == open ]]
          [[ "${pr[1]}" == "$GITHUB_REPOSITORY" ]]
          [[ "${pr[2]}" == bump-* ]]
          [[ -z "$HEAD_SHA" || "${pr[3]}" == "$HEAD_SHA" ]]
          if [[ "$ALLOW_FAILED_CHECKS" == true ]]
          then
            [[ -n "$HEAD_SHA" ]]
            gh pr checks "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" || true
          else
            gh pr checks "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
          else
            brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
        with:
          branch: master

      - name: Delete published update branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          mapfile -t head < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
            --jq '.head.repo.full_name, .head.ref, .head.sha')
          [[ "${head[0]}" == "$GITHUB_REPOSITORY" ]]
          [[ "${head[1]}" == bump-* ]]
          [[ -z "$HEAD_SHA" || "${head[2]}" == "$HEAD_SHA" ]]
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/${head[1]}"

      - name: Warm wfcli build cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wfcli-cache.yml --repo "$GITHUB_REPOSITORY" --ref master
